[package]
name = "seochang_operations_desktop"
version = "0.1.0"
description = "서창 운영일지 하이브리드 데스크톱 앱"
authors = ["Seochang"]
edition = "2021"

[lib]
name = "seochang_operations_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
rhwp = { path = "../vendor/rhwp", default-features = false }
